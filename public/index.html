<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Portal</title>
    <meta name="description" content="Secure login portal to access your personalized dashboard with live clock, date, and custom PNG background customization.">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <div class="bg-container"></div>
    <div class="bg-overlay"></div>

    <div class="login-wrapper">
        <div class="login-card">
            <!-- Brand Header -->
            <div class="brand-header">
                <div class="brand-logo">
                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/>
                    </svg>
                </div>
                <h1>Welcome Back</h1>
                <p>Please log in to access your dashboard</p>
            </div>

            <!-- Auth Tabs (Login / Sign Up) -->
            <div class="auth-tabs">
                <button type="button" class="auth-tab active" id="tab-login">Login</button>
                <button type="button" class="auth-tab" id="tab-register">Sign Up</button>
            </div>

            <!-- Toast Alert Box -->
            <div id="toast-msg" class="toast-msg"></div>

            <!-- Form -->
            <form id="auth-form">
                <div class="form-group">
                    <label for="username">Username</label>
                    <div class="input-container">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                        <input type="text" id="username" name="username" placeholder="Enter username" required autocomplete="username">
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-container">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                        </svg>
                        <input type="password" id="password" name="password" placeholder="Enter password" required autocomplete="current-password">
                    </div>
                </div>

                <button type="submit" id="submit-btn" class="btn-primary">
                    <span>Log In</span>
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                        <polyline points="12 5 19 12 12 19"></polyline>
                    </svg>
                </button>
            </form>

            <!-- Quick Fill Helper for Demo -->
            <div class="demo-hint">
                <p>Default Credentials: <code>admin</code> / <code>password123</code></p>
                <button type="button" class="quick-fill-btn" id="quick-fill-btn">Click to auto-fill</button>
            </div>
        </div>
    </div>

    <script src="/js/login.js"></script>
</body>
</html>
